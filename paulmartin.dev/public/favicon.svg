<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ccb079"/>
      <stop offset="1" stop-color="#a3844e"/>
    </linearGradient>
  </defs>
  <!-- Stone tablet -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="url(#stone)"/>
  <!-- Carved inner bevel (lit) -->
  <rect x="3" y="3" width="26" height="26" rx="3.2" fill="none" stroke="#efdcac" stroke-width="0.9" opacity="0.55"/>
  <!-- Dark border -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#453320" stroke-width="2"/>
  <!-- Engraved initials: a lit lower lip under the dark carve -->
  <g font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" font-size="14.5" letter-spacing="-0.5" text-anchor="middle">
    <text x="16" y="21.7" fill="#e4d09e">PM</text>
    <text x="16" y="21.1" fill="#3e2d18">PM</text>
  </g>
</svg>
