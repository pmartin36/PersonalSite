<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Paul Martin — Software Engineer & Game Developer</title>
    <meta
      name="description"
      content="Paul Martin is a software engineer building games and interactive experiences, from AR games to terminal engines. Explore his projects through an interactive puzzle box."
    />
    <link rel="canonical" href="https://paulmartin.dev/" />

    <!-- Open Graph / Twitter: what LinkedIn, Bluesky, iMessage, Discord and the
         rest show when the link is pasted. og-image.jpg is a capture of the
         settled scene, regenerated by scripts/capture-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paul Martin" />
    <meta property="og:title" content="Paul Martin — Software Engineer & Game Developer" />
    <meta
      property="og:description"
      content="A software engineer building games and interactive experiences, from AR games to terminal engines. Explore the work through an interactive puzzle box."
    />
    <meta property="og:url" content="https://paulmartin.dev/" />
    <meta property="og:image" content="https://paulmartin.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A carved stone puzzle box on a ruined backdrop, its front face engraved Paul Martin." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paul Martin — Software Engineer & Game Developer" />
    <meta
      name="twitter:description"
      content="A software engineer building games and interactive experiences, from AR games to terminal engines. Explore the work through an interactive puzzle box."
    />
    <meta name="twitter:image" content="https://paulmartin.dev/og-image.jpg" />

    <!-- Structured data: names the entity for search engines and the AI crawlers.
         Person plus the site itself, so "Paul Martin" resolves to a software
         engineer who works in games, interactive experiences and puzzles. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://paulmartin.dev/#paul-martin",
            "name": "Paul Martin",
            "url": "https://paulmartin.dev/",
            "image": "https://paulmartin.dev/og-image.jpg",
            "jobTitle": "Software Engineer",
            "description": "Software engineer focused on building games and interactive experiences.",
            "knowsAbout": [
              "Software Engineering",
              "Game Development",
              "Game Design",
              "Interactive Experiences",
              "Augmented Reality",
              "Puzzle Design",
              "Rust",
              "Unity",
              "C#"
            ],
            "sameAs": [
              "https://www.linkedin.com/in/paul-martin-b8547616/",
              "https://bsky.app/profile/paulmartindev.bsky.social",
              "https://github.com/pmartin36"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://paulmartin.dev/#website",
            "url": "https://paulmartin.dev/",
            "name": "Paul Martin",
            "description": "The portfolio of Paul Martin, a software engineer building games and interactive experiences.",
            "author": { "@id": "https://paulmartin.dev/#paul-martin" }
          }
        ]
      }
    </script>
    <!-- SVG first: browsers take the first format they support, and the rest are here for
         the ones that do not (older Safari, Windows shortcuts, iOS home screen). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050508" />
    <!-- The scene background: fetch it early so the opening spin doesn't wait on
         a cold-load decode. -->
    <link rel="preload" as="image" href="/machine/ruins-bg.jpeg" />
    <!-- The carved-name font (Eczar). Preloaded so it is ready before the stone's
         first paint: the face appears already carved, with no fallback-then-swap. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/eczar-latin-var.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
